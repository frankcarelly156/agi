<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Invoice payment confirmation.">
  <title>Payment Confirmation</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="confirmation-page">
  <main class="confirmation-card">
    <div class="confirmation-mark" aria-hidden="true">✓</div>
    <h1>Payment received</h1>
    <p id="confirmation-copy">Your payment provider will send confirmation to the email address you entered at checkout.</p>
    <p class="message" id="status-message" role="status" aria-live="polite"></p>
    <a class="secondary-button" href="/">Return to invoice lookup</a>
  </main>
  <script src="success.js" defer></script>
</body>
</html>
